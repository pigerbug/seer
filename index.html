<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛尔号属性克制与PVE强攻手速查</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0b1120;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --accent: #38bdf8;
            --red: #ef4444;
            --orange: #f97316;
            --yellow: #eab308;
            --green: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 720px; }
        h1 { font-size: 1.45rem; text-align: center; margin-bottom: 6px; color: var(--accent); }
        .desc { text-align: center; font-size: 0.85rem; color: var(--subtext); margin-bottom: 18px; line-height: 1.5; }
        
        .search-box { display: flex; gap: 8px; margin-bottom: 14px; }
        input {
            flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--card); color: #fff; font-size: 1rem; outline: none;
        }
        input:focus { border-color: var(--accent); }
        button {
            padding: 12px 22px; border-radius: 8px; border: none; background: var(--primary);
            color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; white-space: nowrap;
        }
        button:hover { background: #1d4ed8; }
        
        .tags-label { font-size: 0.75rem; color: var(--subtext); margin-bottom: 6px; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
        .tag {
            font-size: 0.78rem; padding: 5px 10px; background: #1e293b; border: 1px solid var(--border);
            border-radius: 6px; cursor: pointer; color: #cbd5e1;
        }
        .tag:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

        .result-container { display: flex; flex-direction: column; gap: 14px; }
        .group-card {
            background: var(--card); border-radius: 10px; padding: 14px 16px;
            border: 1px solid var(--border);
        }

        .rate-header {
            display: flex; align-items: center; justify-content: space-between;
            padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .rate-badge { font-size: 1.15rem; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .rate-tag { font-size: 0.8rem; padding: 2px 8px; border-radius: 4px; font-weight: normal; }

        .prop-item { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed rgba(255,255,255,0.06); }
        .prop-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .prop-title { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .prop-name { color: #facc15; font-weight: bold; font-size: 0.98rem; }
        .prop-type-badge { font-size: 0.72rem; padding: 1px 6px; border-radius: 3px; background: #334155; color: #cbd5e1; }
        
        .pet-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
        .pet-tag {
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(15, 23, 42, 0.6); border: 1px solid #334155;
            padding: 4px 8px; border-radius: 6px; font-size: 0.82rem; color: #f1f5f9;
        }
        .pet-mult { font-size: 0.75rem; font-weight: bold; padding: 1px 4px; border-radius: 3px; }
        
        .c-40 { color: var(--red); } .c-25 { color: var(--orange); }
        .c-20 { color: var(--yellow); } .c-15 { color: var(--accent); } .c-12 { color: var(--green); }
        .bg-40 { background: rgba(239, 68, 68, 0.15); color: var(--red); border-left: 5px solid var(--red); }
        .bg-25 { background: rgba(249, 115, 22, 0.15); color: var(--orange); border-left: 5px solid var(--orange); }
        .bg-20 { background: rgba(234, 179, 8, 0.15); color: var(--yellow); border-left: 5px solid var(--yellow); }
        .bg-15 { background: rgba(56, 189, 248, 0.15); color: var(--accent); border-left: 5px solid var(--accent); }
        .bg-12 { background: rgba(16, 185, 129, 0.15); color: var(--green); border-left: 5px solid var(--green); }
    </style>
</head>
<body>

<div class="container">
    <h1>赛尔号 PVE 强攻手速查表</h1>
    <p class="desc">
        <strong>PVE强攻手定义</strong>：具备极高单发爆发、连环暴击引爆、<span style="color:var(--accent)">低体力3倍等高倍率红伤</span>、<span style="color:var(--accent)">魂印巨额常驻增伤</span>或高额粉伤的顶级打手。
    </p>

    <div class="search-box">
        <input type="text" id="propInput" placeholder="输入 Boss 属性，如：水·暗影、草、圣灵">
        <button onclick="calculate()">计算克制与打手</button>
    </div>

    <div class="tags-label">热门 Boss 属性测试：</div>
    <div class="tags">
        <span class="tag" onclick="quickQuery('草')">草</span>
        <span class="tag" onclick="quickQuery('水·暗影')">水·暗影</span>
        <span class="tag" onclick="quickQuery('电·战斗')">电·战斗</span>
        <span class="tag" onclick="quickQuery('远古·战斗')">远古·战斗</span>
        <span class="tag" onclick="quickQuery('暗影')">暗影</span>
        <span class="tag" onclick="quickQuery('超能')">超能</span>
    </div>

    <div class="result-container" id="resultBox"></div>
</div>

<script>
// PVE 核心强攻手数据库（已加入低体3倍高爆与魂印高增伤系列）
const petLibrary = {
    // 单系强攻手
    "冰": ["艾欧丽娅 (极高固伤/暴击)", "柯尔德"],
    "自然": ["幻境界皇 (站场续航之神)", "希瓦"],
    "龙": ["王之哈莫 (引爆强攻天花板)", "龙胆·赵云"],
    "光": ["光之惩戒·英卡洛斯 (必爆高伤核弹)"],
    "邪灵": ["魔钰 (低体3倍极高爆发)", "万妖王·摩哥斯 (单点爆破)"],
    "混沌": ["混沌魔君索伦森"],
    "圣灵": ["圣灵谱尼 (六维拉满/免控输出)"],
    "火": ["不灭·艾恩斯", "爆炎·吉尔"],
    "草": ["生灵之主·蒙娜丽莎", "魔灵仙女"],
    "水": ["沧岚", "利爪鲁斯王"],
    "电": ["怒雷·神裁雷伊 (低体3倍极高爆发)", "王·雷伊", "雷神雷伊"],
    "地面": ["王·卡修斯", "镇魂·波希冬"],
    "飞行": ["王·托鲁克", "圣化托鲁克"],
    "机械": ["赛伯斯特", "机械塔克林"],
    "战斗": ["阿尔蒂克 (高连击爆发)", "王·盖亚"],
    "超能": ["王·缪斯", "海瑟薇"],
    "暗影": ["暗影极夜·诺伊尔顿"],
    "神秘": ["米斯蒂克"],
    "次元": ["星皇", "弗里德"],
    "远古": ["远古王", "库贝萨隆"],
    "王": ["重生之翼 (叠层无敌强攻)"],
    "神灵": ["天启帝君 (PVE万金油)"],

    // 双属性复合强攻手
    "光·次元": ["月照星魂 (低体3倍极高爆发)", "时空界皇"],
    "远古·战斗": ["典韦 (魂印巨额常驻增伤)", "格罗姆特 (屠龙者/超高暴击)"],
    "圣灵·电": ["圣霆·雷伊 (强攻麻痹破防)", "圣灵雷皇"],
    "自然·冰": ["千裳 (平民强化天花板)"],
    "圣灵·自然": ["莫妮卡"],
    "电·战斗": ["圣甲·雷伊"],
    "混沌·圣灵": ["混沌·圣灵谱尼"],
    "机械·地面": ["玄武完全体", "圣甲·地裂"],
    "圣灵·次元": ["星皇"],
    "混沌·暗影": ["混沌魔君索伦森"],
    "水·龙": ["沧澜·龙尊"]
};

// 基础单系完全克制池（系数：2.0）
const baseCounters = {
    "草": ["水", "地面", "光"],
    "水": ["火", "地面"],
    "火": ["草", "冰", "机械"],
    "电": ["水", "飞行", "暗影"],
    "地面": ["火", "电", "机械"],
    "飞行": ["草", "战斗"],
    "战斗": ["机械", "冰", "龙", "圣灵"],
    "机械": ["冰", "战斗"],
    "冰": ["草", "地面", "飞行", "龙"],
    "光": ["暗影", "超能"],
    "暗影": ["超能", "次元"],
    "神秘": ["电", "圣灵"],
    "龙": ["冰", "圣灵"],
    "圣灵": ["水", "火", "草", "电", "冰"],
    "次元": ["超能", "邪灵"],
    "邪灵": ["光", "暗影"],
    "自然": ["水", "火", "草", "地面", "光"],
    "王": ["草", "水", "火", "战斗", "暗影", "光"],
    "混沌": ["圣灵", "暗影", "邪灵"],
    "神灵": ["混沌", "邪灵", "神秘"]
};

// 预登记的双属性强攻手组合字典
const dualPropsList = [
    ["光", "次元"], ["圣灵", "电"], ["自然", "冰"], ["圣灵", "自然"], 
    ["远古", "战斗"], ["电", "战斗"], ["混沌", "圣灵"], ["机械", "地面"], 
    ["圣灵", "次元"], ["混沌", "暗影"], ["水", "龙"]
];

function quickQuery(name) {
    document.getElementById('propInput').value = name;
    calculate();
}

function getSingleMult(atk, def) {
    if (baseCounters[atk] && baseCounters[atk].includes(def)) return 2.0;
    return 1.0;
}

function getRateStyle(rate) {
    if (rate >= 4.0) return { cls: 'bg-40', textCls: 'c-40', label: '极致4倍爆杀' };
    if (rate >= 2.5) return { cls: 'bg-25', textCls: 'c-25', label: '巨额克制倍率' };
    if (rate >= 2.0) return { cls: 'bg-20', textCls: 'c-20', label: '常规高伤克制' };
    if (rate >= 1.5) return { cls: 'bg-15', textCls: 'c-15', label: '中度辅助克制' };
    return { cls: 'bg-12', textCls: 'c-12', label: '轻度克制' };
}

function calculate() {
    const raw = document.getElementById('propInput').value.trim();
    if (!raw) return;

    // 格式化用户输入，切分可能存在的双属性
    const targets = raw.split(/[·\.\s\/-]+/).filter(Boolean);
    const resultBox = document.getElementById('resultBox');
    resultBox.innerHTML = '';

    const list = [];

    // 计算所有单系
    Object.keys(baseCounters).forEach(atk => {
        let mult = 1.0;
        if (targets.length === 1) {
            mult = getSingleMult(atk, targets[0]);
        } else {
            const m1 = getSingleMult(atk, targets[0]);
            const m2 = getSingleMult(atk, targets[1]);
            if (m1 === 2.0 && m2 === 2.0) mult = 4.0;
            else if (m1 === 2.0 || m2 === 2.0) mult = 2.0;
            else mult = 1.0;
        }
        if (mult > 1.0) {
            list.push({ prop: atk, isDual: false, rate: mult, pets: petLibrary[atk] || ["该系强攻手"] });
        }
    });

    // 计算所有具备强攻手的双系
    dualPropsList.forEach(([p1, p2]) => {
        const dualName = `${p1}·${p2}`;
        const altDualName = `${p2}·${p1}`;
        const pets = petLibrary[dualName] || petLibrary[altDualName] || ["该复合系强攻手"];

        let mult = 1.0;
        if (targets.length === 1) {
            const m1 = getSingleMult(p1, targets[0]);
            const m2 = getSingleMult(p2, targets[0]);
            if (m1 === 2.0 && m2 === 2.0) mult = 2.5; 
            else if (m1 === 2.0 || m2 === 2.0) mult = 2.0;
        } else {
            const t1 = targets[0], t2 = targets[1];
            const count = (getSingleMult(p1, t1)===2.0 ? 1 : 0) + 
                          (getSingleMult(p1, t2)===2.0 ? 1 : 0) + 
                          (getSingleMult(p2, t1)===2.0 ? 1 : 0) + 
                          (getSingleMult(p2, t2)===2.0 ? 1 : 0);
            if (count >= 3) mult = 4.0;
            else if (count === 2) mult = 2.5;
            else if (count === 1) mult = 1.5;
        }
        if (mult > 1.0) list.push({ prop: dualName, isDual: true, rate: mult, pets: pets });
    });

    // 严谨排序：按倍率从高到低
    list.sort((a, b) => b.rate - a.rate);

    // 聚合分组
    const grouped = {};
    list.forEach(item => {
        const rKey = item.rate.toFixed(2).replace('.00',''); 
        if (!grouped[rKey]) grouped[rKey] = [];
        grouped[rKey].push(item);
    });

    const sortedRateKeys = Object.keys(grouped).sort((a, b) => parseFloat(b) - parseFloat(a));

    if (sortedRateKeys.length === 0) {
        resultBox.innerHTML = `
            <div class="group-card">
                <div class="prop-item">
                    无明显属性克制。建议直接出动无视克制关系的 <strong>“机制类强攻真神”</strong>：
                    <div class="pet-list" style="margin-top:8px;">
                        <span class="pet-tag"><span class="pet-mult c-20">引爆</span>王之哈莫</span>
                        <span class="pet-tag"><span class="pet-mult c-20">固伤</span>艾欧丽娅</span>
                        <span class="pet-tag"><span class="pet-mult c-20">站场</span>幻境界皇</span>
                        <span class="pet-tag"><span class="pet-mult c-20">低体</span>魔钰</span>
                    </div>
                </div>
            </div>
        `;
        return;
    }

    // 渲染卡片
    sortedRateKeys.forEach(rKey => {
        const rateVal = parseFloat(rKey);
        const style = getRateStyle(rateVal);
        const items = grouped[rKey];

        const card = document.createElement('div');
        card.className = `group-card ${style.cls}`;

        let html = `
            <div class="rate-header">
                <div class="rate-badge ${style.textCls}">
                    <span>${rateVal} 倍克制</span>
                </div>
                <span class="rate-tag" style="background:rgba(255,255,255,0.08);">${style.label}</span>
            </div>
        `;

        items.forEach(item => {
            html += `
                <div class="prop-item">
                    <div class="prop-title">
                        <span class="prop-name">【${item.prop}】</span>
                        <span class="prop-type-badge">${item.isDual ? '双属性' : '单系'}</span>
                    </div>
                    <div class="pet-list">
                        ${item.pets.map(pet => `
                            <span class="pet-tag">
                                <span class="pet-mult ${style.textCls}">${rateVal}x</span>${pet}
                            </span>
                        `).join('')}
                    </div>
                </div>
            `;
        });
        card.innerHTML = html;
        resultBox.appendChild(card);
    });
}
</script>
</body>
</html>
