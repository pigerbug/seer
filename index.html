<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛尔号属性克制与PVE强攻手速查</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0b1120;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --accent: #38bdf8;
            --red: #ef4444;
            --orange: #f97316;
            --yellow: #eab308;
            --green: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 720px; }
        h1 { font-size: 1.45rem; text-align: center; margin-bottom: 6px; color: var(--accent); }
        .desc { text-align: center; font-size: 0.85rem; color: var(--subtext); margin-bottom: 18px; }
        
        .search-box {
            display: flex; gap: 8px; margin-bottom: 14px;
        }
        input {
            flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--card); color: #fff; font-size: 1rem; outline: none;
        }
        input:focus { border-color: var(--accent); }
        button {
            padding: 12px 22px; border-radius: 8px; border: none; background: var(--primary);
            color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; white-space: nowrap;
        }
        button:hover { background: #1d4ed8; }
        
        .tags-label { font-size: 0.75rem; color: var(--subtext); margin-bottom: 6px; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
        .tag {
            font-size: 0.78rem; padding: 5px 10px; background: #1e293b; border: 1px solid var(--border);
            border-radius: 6px; cursor: pointer; color: #cbd5e1;
        }
        .tag:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

        .result-container { display: flex; flex-direction: column; gap: 14px; }
        .group-card {
            background: var(--card); border-radius: 10px; padding: 14px 16px;
            border: 1px solid var(--border);
        }

        .rate-header {
            display: flex; align-items: center; justify-content: space-between;
            padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .rate-badge {
            font-size: 1.15rem; font-weight: bold; display: flex; align-items: center; gap: 6px;
        }
        .rate-tag { font-size: 0.8rem; padding: 2px 8px; border-radius: 4px; font-weight: normal; }

        .prop-item { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed rgba(255,255,255,0.06); }
        .prop-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .prop-title { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .prop-name { color: #facc15; font-weight: bold; font-size: 0.98rem; }
        .prop-type-badge { font-size: 0.72rem; padding: 1px 6px; border-radius: 3px; background: #334155; color: #cbd5e1; }
        
        .pet-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
        .pet-tag {
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(15, 23, 42, 0.6); border: 1px solid #334155;
            padding: 4px 8px; border-radius: 6px; font-size: 0.82rem; color: #f1f5f9;
        }
        .pet-mult {
            font-size: 0.75rem; font-weight: bold; padding: 1px 4px; border-radius: 3px;
        }
        
        /* 倍率颜色区分 */
        .c-40 { color: var(--red); }
        .c-25 { color: var(--orange); }
        .c-20 { color: var(--yellow); }
        .c-15 { color: var(--accent); }
        .c-12 { color: var(--green); }

        .bg-40 { background: rgba(239, 68, 68, 0.15); color: var(--red); border-left: 5px solid var(--red); }
        .bg-25 { background: rgba(249, 115, 22, 0.15); color: var(--orange); border-left: 5px solid var(--orange); }
        .bg-20 { background: rgba(234, 179, 8, 0.15); color: var(--yellow); border-left: 5px solid var(--yellow); }
        .bg-15 { background: rgba(56, 189, 248, 0.15); color: var(--accent); border-left: 5px solid var(--accent); }
        .bg-12 { background: rgba(16, 185, 129, 0.15); color: var(--green); border-left: 5px solid var(--green); }
    </style>
</head>
<body>

<div class="container">
    <h1>赛尔号 PVE 强攻克制速查</h1>
    <p class="desc">按克制倍率从高到低排序，每只推荐精灵均标明精准克制倍数</p>

    <div class="search-box">
        <input type="text" id="propInput" placeholder="输入Boss属性，如：草、水·暗影、电·战斗、混沌·圣灵">
        <button onclick="calculate()">查询克制</button>
    </div>

    <div class="tags-label">热门 Boss 属性快捷查询：</div>
    <div class="tags">
        <span class="tag" onclick="quickQuery('草')">草</span>
        <span class="tag" onclick="quickQuery('水·暗影')">水·暗影</span>
        <span class="tag" onclick="quickQuery('电·战斗')">电·战斗</span>
        <span class="tag" onclick="quickQuery('圣灵·自然')">圣灵·自然</span>
        <span class="tag" onclick="quickQuery('远古·战斗')">远古·战斗</span>
        <span class="tag" onclick="quickQuery('混沌·圣灵')">混沌·圣灵</span>
        <span class="tag" onclick="quickQuery('机械·地面')">机械·地面</span>
        <span class="tag" onclick="quickQuery('神秘')">神秘</span>
    </div>

    <div class="result-container" id="resultBox"></div>
</div>

<script>
// 单系与双系 PVE 常用强攻手列表（只精选高爆发、有暴击/先手引爆/高固伤的一线打手）
const petLibrary = {
    // 单系强攻手
    "火": ["艾欧丽娅", "不灭·艾恩斯"],
    "草": ["生灵之主·蒙娜丽莎", "王·草王"],
    "水": ["沧岚", "王·沧岚"],
    "电": ["圣霆·雷伊", "王·雷伊", "雷神雷伊"],
    "地面": ["王·卡修斯", "镇魂·波希冬"],
    "飞行": ["王·托鲁克"],
    "机械": ["赛伯斯特", "机械塔克林"],
    "战斗": ["阿尔蒂克", "王·盖亚"],
    "冰": ["柯尔德", "冰角玄龙"],
    "超能": ["海瑟薇", "王·缪斯"],
    "光": ["光之惩戒·英卡洛斯"],
    "暗影": ["暗影极夜·诺伊尔顿"],
    "神秘": ["米斯蒂克"],
    "龙": ["王·之哈莫", "龙胆·赵云"],
    "圣灵": ["圣灵谱尼", "迈尔斯"],
    "次元": ["弗里德", "星皇"],
    "远古": ["远古王", "库贝萨隆"],
    "邪灵": ["万妖王·摩哥斯"],
    "自然": ["幻境界皇", "拂晓兔"],
    "王": ["重生之翼", "芳馨·茉莉"],
    "混沌": ["混沌魔君索伦森"],
    "神灵": ["圣灵谱尼"],

    // 双系强攻手
    "自然·圣灵": ["莫妮卡"],
    "自然·冰": ["千裳"],
    "电·火": ["圣光天马", "雷炎·雷伊"],
    "电·战斗": ["圣甲·雷伊", "神威·雷伊"],
    "电·暗影": ["混沌·雷伊"],
    "电·圣灵": ["圣灵雷皇"],
    "远古·圣灵": ["圣灵·远古圣神"],
    "远古·战斗": ["格罗姆特"],
    "远古·草": ["圣王·本景"],
    "混沌·暗影": ["混沌魔君索伦森"],
    "混沌·圣灵": ["混沌·圣灵谱尼"],
    "机械·地面": ["圣甲·地裂"],
    "圣灵·次元": ["星皇"],
    "水·龙": ["沧澜·龙尊"]
};

// 单属性完全克制表 (单攻 -> 单守 为 2.0 倍克制)
const baseCounters = {
    "草": ["水", "地面", "光"],
    "水": ["火", "地面"],
    "火": ["草", "冰", "机械"],
    "电": ["水", "飞行", "暗影"],
    "地面": ["火", "电", "机械"],
    "飞行": ["草", "战斗"],
    "战斗": ["机械", "冰", "龙", "圣灵"],
    "机械": ["冰", "战斗"],
    "冰": ["草", "地面", "飞行", "龙"],
    "光": ["暗影", "超能"],
    "暗影": ["超能", "次元"],
    "神秘": ["电", "圣灵"],
    "龙": ["冰", "圣灵"],
    "圣灵": ["水", "火", "草", "电", "冰"],
    "次元": ["超能", "邪灵"],
    "邪灵": ["光", "暗影"],
    "自然": ["水", "火", "草", "地面", "光"],
    "王": ["草", "水", "火", "战斗", "暗影", "光"],
    "混沌": ["圣灵", "暗影", "邪灵"],
    "神灵": ["混沌", "邪灵", "神秘"]
};

// 双属性攻击池
const dualProps = [
    ["自然", "圣灵"], ["自然", "冰"], ["电", "火"], ["电", "战斗"],
    ["电", "暗影"], ["电", "圣灵"], ["远古", "战斗"], ["远古", "圣灵"],
    ["远古", "草"], ["机械", "地面"], ["混沌", "暗影"], ["混沌", "圣灵"],
    ["圣灵", "次元"], ["水", "龙"]
];

function quickQuery(name) {
    document.getElementById('propInput').value = name;
    calculate();
}

// 获取单攻单防倍率
function getSingleMult(atk, def) {
    if (baseCounters[atk] && baseCounters[atk].includes(def)) return 2.0;
    return 1.0;
}

// 格式化倍数标签与配色类
function getRateStyle(rate) {
    if (rate >= 4.0) return { cls: 'bg-40', textCls: 'c-40', label: '极致4倍克制' };
    if (rate >= 2.5) return { cls: 'bg-25', textCls: 'c-25', label: '超高倍率' };
    if (rate >= 2.0) return { cls: 'bg-20', textCls: 'c-20', label: '常规高克制' };
    if (rate >= 1.5) return { cls: 'bg-15', textCls: 'c-15', label: '中度克制' };
    return { cls: 'bg-12', textCls: 'c-12', label: '轻度克制' };
}

function calculate() {
    const raw = document.getElementById('propInput').value.trim();
    if (!raw) return;

    const targets = raw.split(/[·\.\s\/-]+/).filter(Boolean);
    const resultBox = document.getElementById('resultBox');
    resultBox.innerHTML = '';

    const list = [];

    // 1. 计算所有单系攻击倍率
    Object.keys(baseCounters).forEach(atk => {
        let mult = 1.0;
        if (targets.length === 1) {
            mult = getSingleMult(atk, targets[0]);
        } else {
            const m1 = getSingleMult(atk, targets[0]);
            const m2 = getSingleMult(atk, targets[1]);
            if (m1 === 2.0 && m2 === 2.0) mult = 4.0;
            else if (m1 === 2.0 || m2 === 2.0) mult = 2.0;
            else mult = 1.0;
        }

        if (mult > 1.0) {
            const pets = petLibrary[atk] || ["本系主力打手"];
            list.push({ prop: atk, isDual: false, rate: mult, pets: pets });
        }
    });

    // 2. 计算所有双系攻击倍率
    dualProps.forEach(([p1, p2]) => {
        const dualName = `${p1}·${p2}`;
        const altDualName = `${p2}·${p1}`;
        const pets = petLibrary[dualName] || petLibrary[altDualName] || ["复合系打手"];

        let mult = 1.0;
        if (targets.length === 1) {
            const m1 = getSingleMult(p1, targets[0]);
            const m2 = getSingleMult(p2, targets[0]);
            if (m1 === 2.0 && m2 === 2.0) mult = 2.5; // 双系同时克单系加权
            else if (m1 === 2.0 || m2 === 2.0) mult = 2.0;
            else mult = 1.0;
        } else {
            const t1 = targets[0], t2 = targets[1];
            const p1_t1 = getSingleMult(p1, t1) === 2.0;
            const p1_t2 = getSingleMult(p1, t2) === 2.0;
            const p2_t1 = getSingleMult(p2, t1) === 2.0;
            const p2_t2 = getSingleMult(p2, t2) === 2.0;
            const count = (p1_t1?1:0) + (p1_t2?1:0) + (p2_t1?1:0) + (p2_t2?1:0);

            if (count >= 3) mult = 4.0;
            else if (count === 2) mult = 2.5;
            else if (count === 1) mult = 1.5;
            else mult = 1.0;
        }

        if (mult > 1.0) {
            list.push({ prop: dualName, isDual: true, rate: mult, pets: pets });
        }
    });

    // 3. 严格按照倍率从高到低降序排序
    list.sort((a, b) => b.rate - a.rate);

    // 4. 按倍率聚合分组
    const grouped = {};
    list.forEach(item => {
        const rKey = item.rate.toFixed(1);
        if (!grouped[rKey]) grouped[rKey] = [];
        grouped[rKey].push(item);
    });

    const sortedRateKeys = Object.keys(grouped).sort((a, b) => parseFloat(b) - parseFloat(a));

    if (sortedRateKeys.length === 0) {
        resultBox.innerHTML = `
            <div class="group-card">
                <div class="prop-item">
                    未检测到高额克制属性。面对该 Boss 推荐直接使用顶级高爆发通用打手：
                    <div class="pet-list" style="margin-top:8px;">
                        <span class="pet-tag"><span class="pet-mult c-20">通用</span>王·之哈莫</span>
                        <span class="pet-tag"><span class="pet-mult c-20">通用</span>艾欧丽娅</span>
                        <span class="pet-tag"><span class="pet-mult c-20">通用</span>幻境界皇</span>
                    </div>
                </div>
            </div>
        `;
        return;
    }

    // 5. 渲染各倍率卡片
    sortedRateKeys.forEach(rKey => {
        const rateVal = parseFloat(rKey);
        const style = getRateStyle(rateVal);
        const items = grouped[rKey];

        const card = document.createElement('div');
        card.className = `group-card ${style.cls}`;

        let html = `
            <div class="rate-header">
                <div class="rate-badge ${style.textCls}">
                    <span>${rateVal.toFixed(1)} 倍克制</span>
                </div>
                <span class="rate-tag" style="background:rgba(255,255,255,0.08);">${style.label}</span>
            </div>
        `;

        items.forEach(item => {
            html += `
                <div class="prop-item">
                    <div class="prop-title">
                        <span class="prop-name">【${item.prop}】</span>
                        <span class="prop-type-badge">${item.isDual ? '双属性' : '单属性'}</span>
                    </div>
                    <div class="pet-list">
                        ${item.pets.map(pet => `
                            <span class="pet-tag">
                                <span class="pet-mult ${style.textCls}">${rateVal.toFixed(1)}x</span>${pet}
                            </span>
                        `).join('')}
                    </div>
                </div>
            `;
        });

        card.innerHTML = html;
        resultBox.appendChild(card);
    });
}
</script>
</body>
</html>
